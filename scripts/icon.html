<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アイコン 近江Web相談所</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&display=block" rel="stylesheet">
<style>
  /* サイトのアイコン。屋号の頭文字「近」を、サイトの濃い青緑（--teal-deep）の上に白の明朝で置く。
     ?s=<px> で一辺の大きさ、&square=1 で角丸なし（iPhone のホーム画面用。角は端末側で丸められる） */
  * { margin: 0; padding: 0; }
  html, body { background: transparent; }
  .icon {
    display: flex; align-items: center; justify-content: center;
    background: #2f5d72; color: #fff;
    font-family: 'Noto Serif JP', serif; font-weight: 700; line-height: 1;
  }
</style>
</head>
<body>
  <div class="icon" id="icon">近</div>
  <script>
    const q = new URLSearchParams(location.search);
    const s = Number(q.get("s") || 512);
    const el = document.getElementById("icon");
    el.style.width = el.style.height = s + "px";
    // 小さいサイズほど字を大きめにして、16px でも形が潰れないようにする
    el.style.fontSize = Math.round(s * (s <= 32 ? 0.84 : 0.7)) + "px";
    el.style.paddingBottom = Math.round(s * 0.04) + "px";
    el.style.boxSizing = "border-box";
    el.style.borderRadius = q.get("square") ? "0" : Math.round(s * 0.18) + "px";
  </script>
</body>
</html>
